note: Generated from recorded traffic using firefox 145.0.2
configuration:
  dataset: user_dataset_random.csv
  profile: firefox
  vars:
    APP_JPet_Store_App_URL: https://jpetstore.aspectran.com
    User_ID:
      expr: User_ID
      type: column
    New_password:
      expr: Password
      type: column
    Confirm_password:
      expr: Password
      type: column
    First_name:
      expr: First_Name
      type: column
    Last_name:
      expr: Last_Name
      type: column
    Email:
      expr: Email
      type: column
    Phone:
      expr: Phone
      type: column
    Address_1:
      expr: Address
      type: column
    Address_2:
      expr: Address
      type: column
    City:
      expr: City
      type: column
    State:
      expr: State
      type: column
    Zip:
      expr: Zip
      type: column
    Country:
      expr: Country
      type: column
    Username:
      expr: User_ID
      type: column
    Password:
      expr: Password
      type: column
steps:
  - open:
      note: Open JPet Store App
      url: '${APP_JPet_Store_App_URL}'
  - with:
      note: JPetStore Demo
      steps:
        - click:
            shot: JPetStore Demo_pabtwy.dti.jpeg#372
            object: html.a
            identifiers:
              - properties:
                  - content:
                      - val: Sign Up
            use: double_click
  - with:
      note: JPetStore Demo
      steps:
        - open:
            enabled: 'false'
            url: https://jpetstore.aspectran.com/account/newAccountForm
        - click:
            shot: JPetStore Demo_cu2asi.dti.jpeg#526
            object: html.inputtext
            identifiers:
              - properties:
                  - label:
                      - val: 'User ID:'
                  - xpath:
                      - val: //div[@id='jpetstore-content']/div[2]/div/div/form/table/tbody/tr/td[2]/input
            use: hover
        - type:
            shot: JPetStore Demo_ywckhh.dti.jpeg#749
            object: html.inputtext
            identifiers:
              - properties:
                  - label:
                      - val: 'User ID:'
            value: '${User_ID}'
        - click:
            shot: JPetStore Demo_z6uprf.dti.jpeg#1201
