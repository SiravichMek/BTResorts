note: Generated from recorded traffic using firefox 145.0.2
configuration:
  dataset: sample_users.csv
  profile: firefox
  vars:
    APP_Fish_App_URL: https://thai-sea-citizen-web.21hajvtnk7k6.us-south.codeengine.appdomain.cloud/
    password:
      expr: Password
      type: column
    Name:
      expr: Name
      type: column
    Email:
      expr: Email
      type: column
steps:
  - open:
      note: Open Fish App
      url: '${APP_Fish_App_URL}'
  - with:
      note: หน้าแรก | thai sea citizen
      steps:
        - click:
            shot: หน้าแรก _ thai sea citizen_pwllgq.dti.jpeg#288
            object: html.a
            identifiers:
              - properties:
                  - content:
                      - val: เข้าสู่ระบบ
  - with:
      note: กดสมัคร | thai sea citizen
      steps:
        - click:
            shot: เข้าสู่ระบบ _ thai sea citizen_mpqx32.dti.jpeg#644
            object: html.a
            identifiers:
              - properties:
                  - content:
                      - val: สมัครสมาชิก
  - with:
      note: ลงทะเบียน | thai sea citizen
      steps:
        - click:
            shot: ลงทะเบียน _ thai sea citizen_wzi7vk.dti.jpeg#699
            object: html.inputtext
            identifiers:
              - properties:
                  - label:
                      - val: ชื่อ-นามสกุล
        - type:
            shot: ลงทะเบียน _ thai sea citizen_4j3u4z.dti.jpeg#781
            object: html.inputtext
            identifiers:
              - properties:
                  - label:
                      - val: ชื่อ-นามสกุล
